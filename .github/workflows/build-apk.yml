name: Build TP-01 Simple Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Offline Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Signing Keystore for Release APK
        run: |
          if [ ! -f app/release.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias tp01key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass tp01simple \
              -keypass tp01simple \
              -dname "CN=Xinghai TP01, OU=Hardware, O=Xinghai, L=Beijing, S=Beijing, C=CN"
          fi

      - name: Build Debug & Signed Release APKs
        run: |
          gradle assembleDebug assembleRelease --no-daemon

      - name: Prepare Output APK Files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/tp01-simple-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/tp01-simple-debug.apk
          ls -lh dist/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tp01-simple-release-apk
          path: dist/tp01-simple-release.apk
          if-no-files-found: error

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tp01-simple-debug-apk
          path: dist/tp01-simple-debug.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases (on Tag or Manual Dispatch)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tp01-simple-release.apk
            dist/tp01-simple-debug.apk
          generate_release_notes: true
