plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xinghai.tp01simple'
    compileSdk 34

    defaultConfig {
        applicationId "com.xinghai.tp01simple"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword "tp01simple"
            keyAlias "tp01key"
            keyPassword "tp01simple"
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
             if (file("release.keystore").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.10.0'
}
